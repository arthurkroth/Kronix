name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Set up Node (for JS / asset pipeline if needed)
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install system deps for sqlite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run tests
        run: bundle exec rails test
